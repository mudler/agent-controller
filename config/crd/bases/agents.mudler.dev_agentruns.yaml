---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agentruns.agents.mudler.dev
spec:
  group: agents.mudler.dev
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is one run of an AgentProfile.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRunSpec requests one run of a profile.
            properties:
              cancel:
                type: boolean
              memory:
                description: |-
                  Memory false turns memory off for this run. True cannot override a
                  profile with memory disabled.
                type: boolean
              profile:
                minLength: 1
                type: string
              requestedBy:
                description: RequestedBy is the name of the token that created the
                  run.
                minLength: 1
                type: string
              task:
                description: Task is appended to the profile prompt.
                maxLength: 4000
                type: string
              trigger:
                description: Trigger records what started a run.
                enum:
                - schedule
                - manual
                type: string
            required:
            - profile
            - requestedBy
            - trigger
            type: object
            x-kubernetes-validations:
            - message: profile, trigger and requestedBy are immutable
              rule: self.profile == oldSelf.profile && self.trigger == oldSelf.trigger
                && self.requestedBy == oldSelf.requestedBy
            - message: task is immutable
              rule: '(has(self.task) ? self.task : '''') == (has(oldSelf.task) ? oldSelf.task
                : '''')'
            - message: cancel cannot be undone
              rule: '!has(oldSelf.cancel) || !oldSelf.cancel || (has(self.cancel)
                && self.cancel)'
          status:
            description: AgentRunStatus is written by the controller.
            properties:
              completionTime:
                format: date-time
                type: string
              exitCode:
                description: ExitCode is the harness exit code.
                format: int32
                type: integer
              jobName:
                type: string
              message:
                type: string
              phase:
                description: Phase is the lifecycle phase of a run.
                enum:
                - Queued
                - Starting
                - Running
                - Succeeded
                - Failed
                - Cancelled
                - TimedOut
                - Rejected
                type: string
              podName:
                type: string
              profileVersion:
                format: int64
                type: integer
              queuePosition:
                description: QueuePosition is 1-based among queued runs, 0 otherwise.
                format: int32
                type: integer
              startTime:
                format: date-time
                type: string
              steps:
                items:
                  description: Step is one launcher progress mark.
                  properties:
                    at:
                      format: date-time
                      type: string
                    name:
                      type: string
                  required:
                  - at
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the run name must have at most 57 characters
          rule: self.metadata.name.size() <= 57
    served: true
    storage: true
    subresources:
      status: {}
