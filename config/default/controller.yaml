apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller-controller
  namespace: agents
  labels:
    app.kubernetes.io/name: agent-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: agent-controller-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/mudler/agent-controller:latest
          args:
            - controller
            - --namespace=agents
            - --logins-namespace=agent-logins
            - --job-template=/etc/agent-controller/job-template.yaml
            - --harness-versions=nib=v0.14.2
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: job-template
              mountPath: /etc/agent-controller
              readOnly: true
      volumes:
        - name: job-template
          configMap:
            name: agent-controller-job-template
