apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller-server
  namespace: agents
  labels:
    app.kubernetes.io/name: agent-controller
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-controller
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-controller
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: agent-controller-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/mudler/agent-controller:latest
          args:
            - server
            - --namespace=agents
            - --logins-namespace=agent-logins
            - --history-namespace=agent-controller-history
            - --listen=:8080
            - --harness-versions=nib=v0.14.2
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: agent-controller
  namespace: agents
  labels:
    app.kubernetes.io/name: agent-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-controller
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
